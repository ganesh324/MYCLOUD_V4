services:
  backend:
    build:
      context: ./app/backend
    container_name: mycloud-backend
    restart: unless-stopped
    env_file:
      - ./app/data/mycloud.env
    environment:
      MYCLOUD_STORAGE_ROOT: ${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}
      MYCLOUD_SECRET_KEY: ${MYCLOUD_SECRET_KEY:-mycloud_dev_secret_change_me}
    volumes:
      - ./app/data:/app/data
      - ${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}:${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./app/frontend
    container_name: mycloud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
