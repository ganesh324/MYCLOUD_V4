services:
  backend:
    build:
      context: ./app/backend
    container_name: mycloud-backend
    restart: unless-stopped
    env_file:
      - ./app/data/mycloud.env
    environment:
      MYCLOUD_STORAGE_ROOT: ${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}
      MYCLOUD_SECRET_KEY: ${MYCLOUD_SECRET_KEY:-mycloud_dev_secret_change_me}
      MYCLOUD_BACKEND_HOST: ${MYCLOUD_BACKEND_HOST:-0.0.0.0}
      MYCLOUD_BACKEND_PORT: ${MYCLOUD_BACKEND_PORT:-8000}
    volumes:
      - ./app/data:/app/data
      - ${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}:${MYCLOUD_STORAGE_ROOT:-/mnt/Drive1}
    expose:
      - "${MYCLOUD_BACKEND_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('MYCLOUD_BACKEND_PORT', '8000') + '/api/health', timeout=5).read()\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./app/frontend
    container_name: mycloud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./app/data/mycloud.env
    environment:
      MYCLOUD_NGINX_BACKEND_URL: http://backend:${MYCLOUD_BACKEND_PORT:-8000}
    ports:
      - "${MYCLOUD_BIND_IP:-0.0.0.0}:${MYCLOUD_FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
